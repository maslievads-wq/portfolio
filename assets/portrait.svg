<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-label="Portrait placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="rgba(110,231,183,0.22)"/>
      <stop offset="1" stop-color="rgba(110,231,183,0)"/>
    </radialGradient>
  </defs>

  <rect width="480" height="600" fill="url(#bg)"/>
  <rect width="480" height="600" fill="url(#glow)"/>

  <!-- abstract figure silhouette -->
  <g fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.85" stroke-linecap="round">
    <circle cx="240" cy="220" r="86"/>
    <path d="M120 520c0-86 54-150 120-150s120 64 120 150" stroke-width="2"/>
  </g>
  <circle cx="240" cy="220" r="86" fill="url(#accent)" opacity="0.06"/>
  <path d="M120 520c0-86 54-150 120-150s120 64 120 150" fill="url(#accent)" opacity="0.05"/>

  <!-- subtle grid dots -->
  <g fill="#6EE7B7" opacity="0.25">
    <circle cx="70" cy="90" r="2"/><circle cx="410" cy="120" r="2"/>
    <circle cx="60" cy="430" r="2"/><circle cx="420" cy="470" r="2"/>
    <circle cx="120" cy="60" r="1.5"/><circle cx="380" cy="540" r="1.5"/>
  </g>

  <text x="240" y="588" text-anchor="middle" font-family="Inter, Arial, sans-serif"
        font-size="15" letter-spacing="3" fill="#A0A0A0">DMITRY MASLIEV</text>
</svg>
